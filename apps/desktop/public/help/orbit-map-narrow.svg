<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc"><title id="title">How Orbit connects your work</title><desc id="desc">Your project and saved agent together support a mission. The local engine creates a separate worktree for your granted run.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7866d7" stroke-width="1.5"/></marker></defs><rect width="360" height="600" rx="22" fill="#f6f5ff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#29263e}.sub{fill:#625b78;font-size:15px}.label{fill:#6c52c7;font-size:12px;font-weight:700;letter-spacing:1px}</style><rect x="18" y="18" width="324" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(36 36)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 8V4h9l3 4h12v19H2Z"/></g><text x="80" y="48" class="" font-size="18">Project + saved agent</text><text x="36" y="100" class="sub" font-size="20">Your repository + reusable profile</text><path d="M180 131 L180 150" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="154" width="324" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(36 172)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="2" width="23" height="28" rx="5"/><path d="m8 16 4 4 9-10"/></g><text x="80" y="184" class="" font-size="18">One clear mission</text><text x="36" y="236" class="sub" font-size="20">A goal + acceptance criteria</text><path d="M180 267 L180 286" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="290" width="324" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(36 308)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="5" width="22" height="22" rx="5"/><path d="M10 11h10v10H10ZM9 0v5m12-5v5M9 27v5m12-5v5M0 10h4m-4 12h4m22-12h4m-4 12h4"/></g><text x="80" y="320" class="" font-size="18">Local engine</text><text x="36" y="372" class="sub" font-size="20">Coordinates your granted run</text><path d="M180 403 L180 422" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="426" width="324" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(36 444)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="5" r="4"/><circle cx="24" cy="7" r="4"/><circle cx="7" cy="28" r="4"/><path d="M7 9v15m0-5c0-6 17 0 17-8"/></g><text x="80" y="456" class="" font-size="18">Separate worktree</text><text x="36" y="508" class="sub" font-size="20">Changes stay here for review</text><text x="20" y="585" class="sub" font-size="20">You inspect the result and decide.</text></svg>