<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">How Orbit connects your work</title><desc id="desc">Project and saved agent support a mission. The local engine runs granted files in an isolated worktree. You review the result.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7866d7" stroke-width="1.5"/></marker></defs><rect width="960" height="350" rx="22" fill="#f6f5ff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#29263e}.sub{fill:#625b78;font-size:15px}.label{fill:#6c52c7;font-size:12px;font-weight:700;letter-spacing:1px}</style><rect x="24" y="24" width="266" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(42 42)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 8V4h9l3 4h12v19H2Z"/></g><text x="86" y="54" class="" font-size="18">Your project</text><text x="42" y="106" class="sub" font-size="20">The repository you bring</text><rect x="24" y="206" width="266" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(42 224)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="14" cy="9" r="6"/><path d="M3 29v-3a11 11 0 0 1 22 0v3"/></g><text x="86" y="236" class="" font-size="18">Your saved agent</text><text x="42" y="288" class="sub" font-size="20">Role + instructions + model</text><path d="M290 80h28v92h24M290 262h28v-90" fill="none" stroke="#7866d7" stroke-width="2"/><path d="M318 172 L340 172" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="350" y="116" width="264" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(368 134)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="2" width="23" height="28" rx="5"/><path d="m8 16 4 4 9-10"/></g><text x="412" y="146" class="" font-size="18">One clear mission</text><text x="368" y="198" class="sub" font-size="20">Goal + acceptance criteria</text><path d="M620 172H642V80H658" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="668" y="24" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(686 42)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="5" width="22" height="22" rx="5"/><path d="M10 11h10v10H10ZM9 0v5m12-5v5M9 27v5m12-5v5M0 10h4m-4 12h4m22-12h4m-4 12h4"/></g><text x="730" y="54" class="" font-size="18">Local engine</text><text x="686" y="106" class="sub" font-size="20">Coordinates your granted run</text><path d="M802 142 L802 198" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="668" y="206" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(686 224)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="5" r="4"/><circle cx="24" cy="7" r="4"/><circle cx="7" cy="28" r="4"/><path d="M7 9v15m0-5c0-6 17 0 17-8"/></g><text x="730" y="236" class="" font-size="18">Separate worktree</text><text x="686" y="288" class="sub" font-size="20">Changes stay here for review</text></svg>