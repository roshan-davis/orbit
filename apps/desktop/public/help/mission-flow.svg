<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">A mission from start to human completion</title><desc id="desc">Define and assign, grant and run, inspect changes, record real review, human completion. A revision returns to assignment. No merge or push.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7866d7" stroke-width="1.5"/></marker></defs><rect width="960" height="420" rx="22" fill="#f6f5ff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#29263e}.sub{fill:#625b78;font-size:15px}.label{fill:#6c52c7;font-size:12px;font-weight:700;letter-spacing:1px}</style><rect x="24" y="24" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(42 42)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="2" width="23" height="28" rx="5"/><path d="m8 16 4 4 9-10"/></g><text x="86" y="54" class="" font-size="18">1. Define + assign</text><text x="42" y="106" class="sub" font-size="20">Goal and saved agent</text><rect x="346" y="24" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(364 42)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 1h14l8 8v23H5ZM19 1v9h8M10 17h12m-12 6h12"/></g><text x="408" y="54" class="" font-size="18">2. Grant + run</text><text x="364" y="106" class="sub" font-size="20">Approve named files</text><rect x="668" y="24" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(686 42)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="5" r="4"/><circle cx="24" cy="7" r="4"/><circle cx="7" cy="28" r="4"/><path d="M7 9v15m0-5c0-6 17 0 17-8"/></g><text x="730" y="54" class="" font-size="18">3. Inspect changes</text><text x="686" y="106" class="sub" font-size="20">Read diff; check files</text><path d="M298 80 L336 80" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M620 80 L658 80" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M802 143v35H157v32" fill="none" stroke="#7866d7" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="220" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(42 238)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m20 20 10 10M7 12l4 4 7-8"/></g><text x="86" y="250" class="" font-size="18">4. Record real review</text><text x="42" y="302" class="sub" font-size="20">Distinct reviewer identity</text><path d="M298 276 L336 276" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="346" y="220" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(364 238)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="14" cy="7" r="5"/><path d="M4 31v-9a10 10 0 0 1 20 0v9m-15-6 5 4 12-12"/></g><text x="408" y="250" class="" font-size="18">5. Human completion</text><text x="364" y="302" class="sub" font-size="20">Your explicit sign-off</text><text x="670" y="244" class="label" font-size="20">NEEDS CHANGES?</text><text x="670" y="274" class="sub" font-size="20">Request revision</text><text x="670" y="300" class="sub" font-size="20">→ assign again</text><text x="26" y="384" class="sub" font-size="20">Completion records sign-off. It never merges or pushes Git.</text></svg>