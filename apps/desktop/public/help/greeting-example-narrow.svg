<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc"><title id="title">Example: change one greeting</title><desc id="desc">Hypothetical example. Grant greeting.txt, run in a separate worktree, inspect Hello world becoming Hello Orbit. Review before completion.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7866d7" stroke-width="1.5"/></marker></defs><rect width="360" height="720" rx="22" fill="#f6f5ff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#29263e}.sub{fill:#625b78;font-size:15px}.label{fill:#6c52c7;font-size:12px;font-weight:700;letter-spacing:1px}</style><text x="22" y="35" class="label" font-size="20">HYPOTHETICAL EXAMPLE</text><text x="22" y="70" class="" font-size="25">Change one greeting</text><rect x="20" y="96" width="320" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 114)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 1h14l8 8v23H5ZM19 1v9h8M10 17h12m-12 6h12"/></g><text x="82" y="126" class="" font-size="18">You grant greeting.txt</text><text x="38" y="178" class="sub" font-size="20">Acceptance: “Hello Orbit”</text><path d="M180 215 L180 248" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="260" width="320" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 278)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="5" r="4"/><circle cx="24" cy="7" r="4"/><circle cx="7" cy="28" r="4"/><path d="M7 9v15m0-5c0-6 17 0 17-8"/></g><text x="82" y="290" class="" font-size="18">Orbit uses a worktree</text><text x="38" y="342" class="sub" font-size="20">Your original edits stay separate</text><rect x="20" y="400" width="320" height="140" rx="14" fill="#eeecfa"/><text x="38" y="432" class="label" font-size="20">YOU INSPECT THE DIFF</text><text x="38" y="474" class="" font-size="22">− Hello world</text><text x="38" y="513" class="" font-size="22">+ Hello Orbit</text><path d="M180 550 L180 580" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="592" width="320" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 610)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="14" cy="7" r="5"/><path d="M4 31v-9a10 10 0 0 1 20 0v9m-15-6 5 4 12-12"/></g><text x="82" y="622" class="" font-size="18">Review → decide</text><text x="38" y="674" class="sub" font-size="20">No automatic tests or Git merge</text></svg>