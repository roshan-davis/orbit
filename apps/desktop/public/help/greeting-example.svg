<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">Example: change one greeting</title><desc id="desc">Hypothetical example. You grant greeting.txt. Orbit uses a separate worktree. You inspect the diff and decide after review. No automatic tests or Git merge.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7866d7" stroke-width="1.5"/></marker></defs><rect width="960" height="330" rx="22" fill="#f6f5ff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#29263e}.sub{fill:#625b78;font-size:15px}.label{fill:#6c52c7;font-size:12px;font-weight:700;letter-spacing:1px}</style><text x="26" y="34" class="label" font-size="20">HYPOTHETICAL EXAMPLE</text><text x="26" y="72" class="" font-size="26">Change one greeting. See exactly what changed.</text><rect x="24" y="108" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(42 126)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 1h14l8 8v23H5ZM19 1v9h8M10 17h12m-12 6h12"/></g><text x="86" y="138" class="" font-size="18">Grant greeting.txt</text><text x="42" y="190" class="sub" font-size="20">Acceptance: “Hello Orbit”</text><path d="M300 164 L336 164" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="346" y="108" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(364 126)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="5" r="4"/><circle cx="24" cy="7" r="4"/><circle cx="7" cy="28" r="4"/><path d="M7 9v15m0-5c0-6 17 0 17-8"/></g><text x="408" y="138" class="" font-size="18">Separate worktree</text><text x="364" y="190" class="sub" font-size="20">Original edits stay separate</text><path d="M620 164 L658 164" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="668" y="108" width="268" height="112" rx="14" fill="white" stroke="#dcd6f0"/><text x="686" y="137" class="label" font-size="20">YOU INSPECT</text><text x="686" y="172" class="" font-size="20">− Hello world</text><text x="686" y="204" class="" font-size="20">+ Hello Orbit</text><text x="26" y="276" class="sub" font-size="20">Then: actual review → your explicit completion.</text><text x="26" y="304" class="sub" font-size="20">No automatic tests. No automatic Git merge.</text></svg>