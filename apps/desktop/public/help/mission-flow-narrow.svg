<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc"><title id="title">A mission from start to human completion</title><desc id="desc">Define, assign, grant and run, inspect, record review, then human completion. Request revision returns to assignment. Completion never merges or pushes Git.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7866d7" stroke-width="1.5"/></marker></defs><rect width="360" height="850" rx="22" fill="#f6f5ff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#29263e}.sub{fill:#625b78;font-size:15px}.label{fill:#6c52c7;font-size:12px;font-weight:700;letter-spacing:1px}</style><rect x="20" y="20" width="320" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 38)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="2" width="23" height="28" rx="5"/><path d="m8 16 4 4 9-10"/></g><text x="82" y="50" class="" font-size="18">1. Define + assign</text><text x="38" y="102" class="sub" font-size="20">Pick a goal and saved agent</text><path d="M180 133 L180 152" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="156" width="320" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 174)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 1h14l8 8v23H5ZM19 1v9h8M10 17h12m-12 6h12"/></g><text x="82" y="186" class="" font-size="18">2. Grant + run</text><text x="38" y="238" class="sub" font-size="20">Approve named files yourself</text><path d="M180 269 L180 288" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="292" width="320" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 310)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="5" r="4"/><circle cx="24" cy="7" r="4"/><circle cx="7" cy="28" r="4"/><path d="M7 9v15m0-5c0-6 17 0 17-8"/></g><text x="82" y="322" class="" font-size="18">3. Inspect changes</text><text x="38" y="374" class="sub" font-size="20">Read the diff; check the files</text><path d="M180 405 L180 424" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="428" width="320" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 446)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m20 20 10 10M7 12l4 4 7-8"/></g><text x="82" y="458" class="" font-size="18">4. Record real review</text><text x="38" y="510" class="sub" font-size="20">Use a distinct reviewer identity</text><path d="M180 541 L180 560" stroke="#7866d7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="564" width="320" height="108" rx="14" fill="white" stroke="#dcd6f0"/><g transform="translate(38 582)" fill="none" stroke="#7860ca" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="14" cy="7" r="5"/><path d="M4 31v-9a10 10 0 0 1 20 0v9m-15-6 5 4 12-12"/></g><text x="82" y="594" class="" font-size="18">5. Human completion</text><text x="38" y="646" class="sub" font-size="20">Your explicit sign-off</text><text x="22" y="731" class="label" font-size="20">Needs changes?</text><text x="22" y="757" class="sub" font-size="20">Request revision → assign again.</text><text x="22" y="806" class="sub" font-size="20">Completion does not merge or push Git.</text></svg>